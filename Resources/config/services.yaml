services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\AbrechnungBundle\:
        resource: '../../*'
        exclude:
            - '../../Resources/'
            - '../../DependencyInjection/'
            - '../../Controller/'

    KimaiPlugin\AbrechnungBundle\Controller\:
        resource: '../../Controller'
        tags: ['controller.service_arguments']
        public: true
